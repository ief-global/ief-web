<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>தாய்த்தமிழ்ப் பள்ளிகள்</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <style>
        [x-cloak] { display: none !important; }
        .hero-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        body { font-family: 'Noto Sans', 'Noto Sans Tamil', sans-serif !important; }

        /* Horizontal card shelf scrollbar */
        .gallery-reel::-webkit-scrollbar { height: 6px; }
        .gallery-reel::-webkit-scrollbar-track { background: rgba(255,255,255,0.08); border-radius: 999px; }
        .gallery-reel::-webkit-scrollbar-thumb { background: rgba(96,165,250,0.55); border-radius: 999px; }
        .gallery-reel::-webkit-scrollbar-thumb:hover { background: rgba(96,165,250,0.85); }
        .gallery-reel { scrollbar-width: thin; scrollbar-color: rgba(96,165,250,0.55) rgba(255,255,255,0.08); }
    </style>
</head>

<body class="bg-slate-950 text-white font-sans" x-data="{ showDonate: false, lang: 'ta' }">

<!--#include virtual="/parts/nav-ta.html" -->

<!-- Page Header -->
<section class="hero-gradient py-14 px-6 text-center">
    <div class="max-w-3xl mx-auto">
        <p class="text-blue-200 text-sm font-semibold uppercase tracking-widest mb-3">தாய்த்தமிழ்ப் பள்ளிகள்</p>
        <p class="text-slate-200 text-base md:text-lg leading-relaxed">
            தமிழ்நாடு முழுவதும் உள்ள 15 தாய்த்தமிழ்ப் பள்ளிகள், குழந்தைகளுக்குத் தாய்மொழியில்
            கல்வியை வழங்குகின்றன. ஒவ்வொரு பள்ளிகளைப் பற்றி முழுமையாக அறிய அப்பள்ளிகளின் பக்கங்களைப் பார்வையிடுங்கள்.
        </p>
    </div>
</section>

<!-- SCHOOLS — vertical list of stacked horizontal cards (generated from html/data/schools.json) -->
<section class="py-16 bg-slate-950">
    <div class="max-w-5xl mx-auto px-8 sm:px-6">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-white">பள்ளி வலையமைப்பைக் காண்க</h2>
        </div>

        <div class="flex flex-col gap-6">
            <!--#school-cards lang="ta"-->
        </div>
    </div>
</section>

<!--#include virtual="/parts/donate-modal.html" -->
<!--#include virtual="/parts/footer-ta.html" -->

</body>
</html>
